services:
  # Web application (Node.js API + Static React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_campus_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/smart_campus_complaints
      - JWT_SECRET=smart_campus_secure_production_jwt_secret_key_2026
      - JWT_EXPIRE=30d
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - app_uploads:/app/backend/uploads

  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: smart_campus_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  app_uploads:
